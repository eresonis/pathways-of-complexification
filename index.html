:root{--ink:#263b42;--muted:#64757b;--accent:#306c75;--paper:#f7f5ee;--line:#d5dddc;--gold:#bc873b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 system-ui,sans-serif}header{padding:18px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}main{max-width:1150px;margin:35px auto;padding:0 24px}h1{font:600 clamp(36px,6vw,65px)/1.1 Georgia,serif;margin:15px 0 25px}h2{font:600 29px/1.25 Georgia,serif}h3{margin:0 0 10px}p{margin:12px 0 18px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:750;color:var(--accent)}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:25px}.card{background:white;padding:23px;border:1px solid var(--line);border-radius:15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat{border-radius:10px;background:#e5eeeb;padding:14px}.stat strong{display:block;font-size:26px}button,input,textarea{font:inherit}button{border:1px solid var(--line);border-radius:9px;background:white;padding:10px 17px;color:var(--ink);cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.5;cursor:default}.choice{text-align:left;padding:20px;border-radius:13px}.choice b{display:block}.selected{background:#e6efeb;border:2px solid var(--accent)}.notice{padding:17px 20px;background:#eee4cd;border-left:4px solid var(--gold);border-radius:8px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}textarea{width:100%;min-height:90px;background:white;border:1px solid var(--line);padding:12px;border-radius:8px}label{display:block;font-weight:600;margin:17px 0 7px}input,select{padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;max-width:100%}.rank{display:grid;grid-template-columns:25px 1fr auto;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}.rank label{margin:0;font-weight:500}.rank button{padding:5px 9px}.rank input{margin-right:8px}.bar{height:7px;background:#dfe6e2;border-radius:8px;margin:15px 0}.bar span{display:block;background:var(--accent);height:100%;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px 7px;text-align:left;border-bottom:1px solid var(--line)}.scroll{overflow:auto}details{margin:20px 0}summary{cursor:pointer;font-weight:700}footer{margin:40px 0;font-size:13px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}header{flex-wrap:wrap}.card{padding:18px}}@media print{header,button,.no-print{display:none}body{background:white;font-size:12px}.card{break-inside:avoid}main{margin:0}}

const KEY='complexification-v5-demography';const categories=[['surplus','Producing and Storing Food'],['specialization','Developing Specialized Activities'],['works','Constructing Monuments/Public Works'],['ritual','Organizing Communal Rituals'],['government','Coordinating Collective Decisions'],['interdependence','Increasing (Inter-)dependence Among Households and Villages'],['growth','Encouraging Demographic Growth'],['conflict','Managing Relations and Disputes With Neighbors']];const names=Object.fromEntries(categories);
const fresh=()=>({stage:'intro',round:0,group:'',scenario:'A',priorities:[],notes:{},choice:null,food:100,reserve:20,trust:65,autonomy:75,inequality:15,centralization:15,violence:10,strain:0,population:100,interdependence:10,dependencyAsymmetry:0,regionalIntegration:0,systems:{surplus:0,labor:0,works:0,ritual:0,government:0,trade:0,craft:0,tools:0,war:0,growth:0,care:0},history:[]});let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}let guide=false;const clamp=x=>Math.max(0,Math.min(100,x));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};
// Each option specifies durable investment, institution effects, project labor, and subsistence emphasis.
const opt=(title,body,cost,focus,systems,effects,detail)=>({title,body,cost,focus,systems,effects,detail});
const rounds=[
{title:'Who controls the surplus?',intro:'Your community begins with about 100 people, produces food and maintains ties with neighboring communities. Some households have reserves; others have little. How should food be stored and accessed?',options:[
opt('Maintain household stores and reciprocal aid','Maintain household control, with a negotiated commitment to help in shortages.',8,'surplus',{surplus:1},{trust:5,autonomy:5},'Flexible household control; assistance depends on relationships.'),
opt('Create a shared store with elected stewards','Pool part of the harvest; publish contributions and withdrawals.',14,'government',{surplus:2,government:1},{trust:10,centralization:8,autonomy:-4},'More oversight and coordination; stewards require support.'),
opt('Appoint a leader to collect and redistribute','Give a leader authority to collect food and decide who receives it.',12,'government',{surplus:2,government:2},{centralization:18,inequality:10,autonomy:-12,trust:4},'Concentrate control; unequal access can undermine cooperation.'),
opt('Invest in production before pooling','Improve food-producing facilities while keeping stores separate.',18,'surplus',{surplus:2,labor:1},{autonomy:3,inequality:4},'Increase productive potential, at a present labor cost.') ]},
{title:'Who can leave subsistence work?',intro:'People can become more skilled when they devote time to particular activities. Specialists still need food, and their work is not automatically useful in every circumstance.',options:[
opt('Rotate public duties','Share maintenance and coordination work among households.',10,'specialization',{labor:1,works:1},{trust:6,autonomy:3},'Broad participation; fewer people become full-time experts.'),
opt('Support toolmakers','Feed a small group that develops tools used in food production.',17,'specialization',{craft:2,labor:1,tools:2},{inequality:5},'Tools can improve later returns; specialist upkeep competes with food labor.'),
opt('Support administrators','Assign people to records, collection, and distribution.',15,'government',{government:2,labor:1},{centralization:12,autonomy:-6,inequality:4},'Distribution becomes more organized; oversight is costly.'),
opt('Support care and apprenticeships','Share childcare and teach skills while encouraging households and newcomers to grow.',15,'growth',{care:2,growth:1,labor:1},{trust:7,autonomy:3},'Care supports participation and growth; more people need food and facilities.') ]},
{title:'Build something together?',intro:'A major construction project can change shared life and leave visible material traces. Decide what it is for, who works on it, and who controls its benefits.',options:[
opt('Construct shared water and storage facilities','Organize a communal project with household participation.',20,'works',{works:2,surplus:1},{trust:7,autonomy:-3},'Later productive benefits, with substantial construction and maintenance.'),
opt('Create space for communal activities','Build a place for gatherings, ceremonies, and shared activities.',18,'ritual',{works:1,ritual:2},{trust:9},'Support relationships and coordination; construction does not directly create food.'),
opt('Commemorate a leader','Construct a monument remembering a leader’s achievements through shared labor.',19,'works',{works:2,ritual:1},{centralization:5,trust:5},'Create a lasting focus of memory; construction and upkeep draw on labor.'),
opt('Construct modest local facilities','Distribute smaller projects among household clusters.',12,'works',{works:1,surplus:1},{autonomy:5,trust:4},'Lower coordination costs and smaller regional-scale benefits.') ]},
{title:'Negotiate with neighbors',intro:'Other communities use some of the same water, land, and routes. Their responses are scripted in this model, not controlled by the other student groups.',options:[
opt('Share activities and reciprocal exchange','Make agreements about complementary production, routes, and assistance.',13,'interdependence',{trade:2,government:1},{trust:6,violence:-6,dependencyAsymmetry:-5,regionalIntegration:8},'Networks can buffer local shortages; agreements need continued effort.'),
opt('Accept unequal terms for regional supplies','Secure access to a larger network in return for food obligations and concessions to its organizers.',17,'interdependence',{trade:3,craft:1},{inequality:7,autonomy:-7,dependencyAsymmetry:24,regionalIntegration:12},'Gain network access, but later transfers and reduced bargaining freedom accompany dependence.'),
opt('Guard local resources','Organize patrols and limit outside access.',17,'conflict',{war:2},{violence:12,autonomy:-5,trust:-3},'Protection may reduce losses during conflict; patrols consume labor.'),
opt('Invite households to settle','Welcome newcomers and expand shared food-producing facilities.',18,'growth',{growth:2,surplus:1,works:1},{trust:3},'More people can contribute later, but food demand and coordination costs rise first.') ]},
{title:'Coordinate a growing community',intro:'More people and more varied activities create new coordination needs. Shared gatherings, representatives, and local arrangements offer different ways to connect households and neighboring villages.',options:[
opt('Hold open gatherings and shared rituals','Hold recurring gatherings with broad participation.',10,'ritual',{ritual:1},{trust:10,autonomy:5,centralization:-4},'Build cooperation; gathering takes time.'),

opt('Organize regional gatherings','Support recurring ceremonies and meetings that connect neighboring villages.',15,'ritual',{ritual:2,trade:1,government:1},{centralization:4,autonomy:-3,trust:7},'Gatherings support shared relationships; participants and organizers need time and resources.'),
opt('Limit collective institutions','Return more decisions and obligations to households.',6,'specialization',{government:-1,ritual:-1},{autonomy:10,centralization:-10},'Lower institutional upkeep; regional coordination becomes harder.') ]},
{title:'Differentiate activities and connect households',intro:'Some households control more goods, stores, or influential positions than others. Differences may appear in houses and burials, but archaeological patterns can have several explanations.',options:[
opt('Redistribute with transparent rules','Use shared stores to aid households and limit accumulated advantages.',12,'surplus',{surplus:1,government:1},{inequality:-12,trust:9,autonomy:-2},'Broader access; collection and oversight take work.'),
opt('Recognize inherited privileges','Give leading households special access and succession rights.',10,'government',{government:1},{inequality:18,centralization:12,autonomy:-10,trust:2},'Stabilize privileged positions; exclusion can increase tensions.'),
opt('Broaden access to skills and exchange','Rotate apprenticeships and help more households enter networks.',15,'specialization',{craft:1,trade:1,labor:1,tools:1},{inequality:-6,trust:7,autonomy:4},'Spread opportunities; training and coordination cost labor.'),
opt('Coordinate complementary village activities','Arrange for neighboring villages to provide different foods, tools, and services.',14,'interdependence',{trade:2,labor:1},{trust:6,autonomy:-3,dependencyAsymmetry:-4,regionalIntegration:10},'Complementary activities reduce duplication and deepen dependence on reliable connections.') ]},
{title:'Manage relations between villages',intro:'Interdependent villages need reliable access to resources and one another. Disputes can be handled through negotiation, defense, aggression, or changing commitments. Each approach has later consequences.',options:[

opt('Organize temporary shared defense','Rotate defensive duties with limits on command.',16,'conflict',{war:1,labor:1},{violence:3,trust:3,autonomy:-3},'Protection without a permanent military institution; households lose work time.'),

opt('Reduce commitments and relocate some activities','Scale back fixed institutions and preserve household options.',12,'specialization',{works:-1,government:-1,war:-1},{autonomy:12,centralization:-8,violence:-5,dependencyAsymmetry:-8,regionalIntegration:-8},'Lose some investment and reserves; retain room to change course.') ]},

opt('Integrate villages under central leadership','Entrust regional leaders with collection, ritual, and enforcement across villages.',13,'government',{government:2,war:1,trade:1},{centralization:15,autonomy:-12,inequality:10,trust:-5,dependencyAsymmetry:20,regionalIntegration:28},'Regional coordination combines with unequal obligations and concentrated decision-making.'),
opt('Connect autonomous households and villages','Reduce centralized offices and maintain reciprocal exchange.',10,'interdependence',{government:-1,trade:1},{autonomy:12,centralization:-12,trust:4,dependencyAsymmetry:-10,regionalIntegration:-8},'Network access with local discretion; coordination remains negotiated.'),
opt('Maintain fewer shared institutions','Scale back some offices and specialization; maintain useful common stores.',8,'surplus',{government:-1,craft:-1,surplus:1},{autonomy:7,trust:3,centralization:-7,inequality:-3,dependencyAsymmetry:-4,regionalIntegration:-6},'Abandon some investment to lower ongoing obligations.') ]}

const eventTypes={good:{name:'Productive conditions',food:1.08,trade:1,pressure:0},dry:{name:'Local water stress',food:.72,trade:1,pressure:0},recovery:{name:'Local production recovers',food:1.08,trade:1,pressure:0},route:{name:'A major exchange route is disrupted',food:1,trade:.25,pressure:0},pests:{name:'Pests threaten stored food',food:1,trade:1,pressure:0,pests:true},conflict:{name:'A regional resource dispute',food:.94,trade:.75,pressure:15},severe:{name:'Outside coercion and disrupted access',food:.96,trade:.6,pressure:24}};
const events={A:['good','good','dry','conflict','pests','recovery','route','dry'],B:['good','good','recovery','route','pests','dry','conflict','severe']};
function plan(state,index){const o=rounds[state.round].options[index],next={...state.systems};for(const [k,v]of Object.entries(o.systems))next[k]=Math.max(0,Math.min(6,next[k]+v));const budget=Math.max(40,Math.round(state.population)-state.strain);const upkeep=Math.round(8+next.surplus*2+next.labor*1.5+next.works*2.5+next.ritual*1.5+next.government*2.5+next.trade*1.5+next.craft*2.5+next.war*3+next.growth*2+next.care*2+Math.max(0,state.population-100)*.12+state.regionalIntegration*.045);const maintenance=Math.min(budget,upkeep);const focused=state.priorities.includes(o.focus);const project=Math.min(Math.max(0,budget-maintenance),Math.round(o.cost*(focused?.80:1)));const foodWork=Math.max(0,budget-maintenance-project);const funded=o.cost===0?1:Math.min(1,project/(o.cost*(focused?.80:1)));if(funded<1)for(const [k,v]of Object.entries(o.systems))if(v>0)next[k]=state.systems[k]+v*funded;return {next,budget,upkeep,maintenance,project,foodWork,focused,funded};}
function resolve(state,index){const o=rounds[state.round].options[index],p=plan(state,index),e=eventTypes[events[state.scenario][state.round]],old={...state.systems};const trust=clamp(state.trust+(o.effects.trust||0));const inequality=clamp(state.inequality+(o.effects.inequality||0));const autonomy=clamp(state.autonomy+(o.effects.autonomy||0));const centralization=clamp(state.centralization+(o.effects.centralization||0));const violence=clamp(state.violence+(o.effects.violence||0));const productive={};for(const k of Object.keys(old))productive[k]=Math.min(old[k],p.next[k])+Math.max(0,p.next[k]-old[k])*.5;const dependencyAsymmetry=clamp(state.dependencyAsymmetry+(o.effects.dependencyAsymmetry||0));const regionalIntegration=clamp(state.regionalIntegration+(o.effects.regionalIntegration||0));const interdependence=clamp(state.interdependence+Math.max(0,o.systems.trade||0)*9+(o.focus==='specialization'?4:0)-(o.focus==='surplus'?4:0));const cooperation=.60+trust*.0045;const tools=1+Math.min(.45,productive.tools*.10);const facilities=1+Math.min(.50,productive.surplus*.065+productive.works*.045+productive.labor*.025+productive.government*.02);const droughtBuffer=e.food<.8?Math.min(.18,productive.works*.035):0;const local=Math.round(p.foodWork*1.44*cooperation*tools*facilities*(e.food+droughtBuffer)*(1-state.interdependence*.0025));const routeAccess=e.trade+state.regionalIntegration*.0035*(1-e.trade);const exchange=Math.round(productive.trade*(4+productive.craft*1.1)*(1+state.interdependence*.010)*routeAccess);const protection=Math.min(.8,productive.war*.14+productive.government*.03+productive.trade*.035*routeAccess+state.regionalIntegration*.001);const escalation=Math.round(violence*.06*(e.pressure>0?1:.3));const conflictLoss=Math.round(e.pressure*(1-protection)+escalation);const raidGain=o.title==='Launch aggression against neighbors'?Math.round(10+productive.war*3):0;const retaliation=o.title==='Launch aggression against neighbors'?Math.round(8+violence*.10):0;const obligations=Math.round(state.dependencyAsymmetry*.30*state.interdependence/100);const gross=Math.max(0,local+exchange+raidGain-conflictLoss-retaliation-obligations);const leaving=Object.values(o.systems).some(v=>v<0);const abandoned=leaving?Math.round(state.reserve*.12):0;const before=state.reserve;const afterMove=Math.max(0,before-abandoned);const loss=Math.round(afterMove*(e.pests?Math.max(.04,.32-p.next.surplus*.045-p.next.government*.01):Math.max(.02,.08-p.next.surplus*.009)));const available=Math.max(0,afterMove-loss),used=Math.min(available,Math.max(0,Math.round(state.population)-gross));const food=gross+used,reserve=Math.min(100,available-used+Math.max(0,gross-Math.round(state.population)));const target=Math.round(state.population);const deficit=Math.max(0,target-food);const previousPopulation=state.population;const populationIncrease=Math.min(180-previousPopulation,Math.round(previousPopulation*(p.next.growth*.020+p.next.care*.008)));const foodRelatedLoss=Math.round(previousPopulation*Math.min(.06,deficit/target*.12));const attackDeaths=o.title==='Launch aggression against neighbors'?Math.max(1,Math.round(previousPopulation*Math.max(.035,Math.min(.10,.045+e.pressure*.001+(100-trust)*.0003-productive.war*.004)))):0;const conflictDeaths=e.pressure>0?Math.round(previousPopulation*.025*(1-protection)*(1+violence/100)):0;const nextPopulation=Math.max(1,Math.min(180,previousPopulation+populationIncrease-foodRelatedLoss-attackDeaths-conflictDeaths));const strain=deficit?Math.min(20,state.strain+Math.ceil(deficit*.10)):Math.max(0,state.strain-6);const exclusion=Math.max(0,inequality-35)*.12+Math.max(0,centralization-autonomy-20)*.07+dependencyAsymmetry*.025;const newTrust=clamp(Math.round(trust-exclusion-deficit*.18));state.dependencyAsymmetry=dependencyAsymmetry;state.regionalIntegration=regionalIntegration;state.interdependence=interdependence;state.population=nextPopulation;state.food=food;state.reserve=reserve;state.trust=newTrust;state.inequality=inequality;state.autonomy=autonomy;state.centralization=centralization;state.violence=violence;state.strain=strain;for(const k of Object.keys(p.next))state.systems[k]=+p.next[k].toFixed(2);state.history.push({round:state.round+1,choice:o.title,event:e.name,local,exchange,conflictLoss,raidGain,retaliation,obligations,gross,loss,abandoned,used,food,reserve,budget:p.budget,upkeep:p.maintenance,project:p.project,foodWork:p.foodWork,target,previousPopulation,populationIncrease,foodRelatedLoss,attackDeaths,conflictDeaths,population:nextPopulation,interdependence,dependencyAsymmetry,regionalIntegration,trust:newTrust,autonomy,inequality,centralization,violence,strain,focused:p.focused,reason:state.notes['reason'+state.round]||''});state.round++;state.stage='result';state.choice=null;return state;}
function note(k,label){return `<label for="${k}">${label}</label><textarea id="${k}" oninput="s.notes['${k}']=this.value;save()">${esc(s.notes[k]||'')}</textarea>`}function stats(){return `<div class="stats"><div class="stat"><small>Food / current requirement</small><strong>${s.food} / ${s.history.at(-1)?.target||Math.round(s.population)}</strong></div><div class="stat"><small>Reserve / capacity 100</small><strong>${s.reserve}</strong></div><div class="stat"><small>Population</small><strong>${s.population}</strong></div><div class="stat"><small>(Inter-)dependence / 100</small><strong>${Math.round(s.interdependence)}</strong></div></div>`}
function portrait(){return `<div class="card"><h3>How is collective life organized?</h3><p>Cooperation: <b>${s.trust}/100</b><br>Household autonomy: <b>${s.autonomy}/100</b><br>Unequal dependencies: <b>${s.dependencyAsymmetry}/100</b><br>Political integration among villages: <b>${s.regionalIntegration}/100</b><br>Unequal access: <b>${Math.round(s.inequality)}/100</b><br>Centralized authority: <b>${Math.round(s.centralization)}/100</b><br>Conflict escalation: <b>${Math.round(s.violence)}/100</b><br>Next episode’s food requirement: <b>${Math.round(s.population)}</b><br>Available labor: <b>${Math.round(s.population)-s.strain}</b></p><small>These are separate teaching indices. They do not form a score for “how complex” or “how advanced” a society is.</small></div>`}
function toggle(k){if(s.priorities.includes(k))s.priorities=s.priorities.filter(x=>x!==k);else if(s.priorities.length<3)s.priorities.push(k);render(true)}function render(keepScroll=false){const scrollY=window.scrollY||0;save();let h='';if(guide){h=`<span class="eyebrow">Facilitator view · Week 9</span><h1>A 40-minute discussion of complexification</h1><div class="grid"><div class="card"><h2>Two setup options</h2><h3>Groups of 3–5</h3><p>One device per group. Assign a reader, recorder, skeptic, and spokesperson. Alternate A and B across groups. Have students choose three priorities, and state what kind of community they want to sustain.</p><h3>One device for a section of about 20</h3><p>The TA operates one shared run, projecting or reading the choices aloud. Form four advisory groups of about five. Give them a minute to confer, hear two contrasting proposals, then vote by show of hands. Rotate spokespeople; record the majority’s reasoning and one minority concern. The TA breaks persistent ties. Choose one scenario; use the summary below to discuss the other.</p><ol><li><b>0–6 minutes:</b> Read, choose three priorities, and state a goal.</li><li><b>6–30 minutes:</b> Eight rounds, about three minutes each. Discuss costs, commit, and interpret.</li><li><b>30–34 minutes:</b> Prepare a recommendation with two outcomes and one cost.</li><li><b>34–40 minutes:</b> Compare strategies and archaeological traces.</li></ol><p>Allow the remaining five minutes of the 45-minute section for setup and transitions.</p><h3>Scenario outcomes · Quick debrief</h3><p><b>A · Local resource stress:</b> Water stress tests food production and shared facilities; disrupted exchange can remove a useful buffer. <b>B · Regional disruption:</b> Broken routes and outside coercion test networks, negotiation, and defense. Population growth increases demand as well as working potential; attacks and regional violence can reduce population. Specialized capacity can improve production while increasing upkeep. Unequal supply agreements impose continuing transfers, and disrupted networks can expose dependence. In both, dependable food can coexist with unequal access or reduced autonomy. Too many costly institutions can crowd out subsistence work. Compare who benefits and who bears costs, not just which group has the most food.</p><h3>Questions to draw out</h3><ul><li>Which institutions helped coordinate work, and what did maintaining them cost?</li><li>Did more food mean more equitable access or greater autonomy?</li><li>When did networks buffer stress, and when did dependence create vulnerability?</li><li>Did armed protection prevent losses while increasing other costs?</li><li>How did growing population and (inter-)dependence change later choices? How did reciprocal or unequal dependencies differ? Did political integration reduce some risks while adding obligations? Which priorities would you now change?</li><li>Could similar monuments or rich burials arise through different processes?</li></ul></div><aside><div class="card"><h2>Purpose and limits</h2><p>This follows Seeds of Change. Start afresh with a food-producing community of about 100 and connections to neighboring settlements. No previous score is imported. Growth raises food requirements and available labor, with care and infrastructure using some of that labor. Population is an invented demographic model, not a historical prediction.</p><p>Students explore complexification: changes in population, differentiation of activities, and interdependence among households and villages. Political organization is one dimension within that process. Students may build institutions, encourage growth, care for households, resolve disputes, organize communal defense, or choose aggression. These are possibilities to investigate, not required stages. Specialized capacities, dependency obligations, and political commitments carry forward; comparable food totals can conceal quite different labor burdens and relationships.</p><p>Episodes represent changes across generations. All coefficients and indices are invented for teaching, not calibrated historical estimates. Neighbor responses are scripted. Unequal access within the community and unequal dependencies between communities are separate indices. Political integration concerns connections across villages, while centralized authority concerns how decisions are concentrated. Inequality is an access index, not a Gini coefficient; centralization is not a measure of total power or social complexity.</p><details><summary>Transparent model</summary><p>Available labor begins at 100 and changes with population. Population scales labor potential in teaching units, not a count of working adults; age structure is abstracted. Household work and institutional upkeep are paid first; projects use more labor, leaving the rest for food. A chosen priority lowers that project’s coordination cost by 20%. There is no ranking task or hidden ranking effect. New investments produce half their benefit in their first episode.</p><p>Local food return depends on labor, cooperation, useful tools, productive facilities, administrative coordination, and environmental conditions. Toolmaking supports subsistence; exchange crafts support trade returns. Both require ongoing specialist support. Exchange can bring food but depends on routes. Increasing (inter-)dependence supports exchange returns while shifting some activity away from independent local provisioning. A disrupted route therefore affects communities differently depending on their earlier commitments. Unequal dependencies create continuing food obligations; the index measures obligations imposed on this community, not which households gain inside it. Political integration among villages increases coordination upkeep but provides some buffering of disrupted access and resource disputes. Representative and concentrated arrangements can both integrate villages, with different consequences for unequal obligations and autonomy. Military, governmental, and negotiated network arrangements can limit conflict losses. Escalation can raise those losses. Aggression can seize resources immediately, but also triggers retaliation, kills some attackers, and carries higher escalation forward. Reduced population changes the next episode’s labor and food requirement.</p><p>Growth and care investments increase population carried into the next episode, up to a teaching limit of 180. Population, arrivals/increases, and losses are always whole numbers. Food stress can cause departures or other demographic losses. Attacks cause deaths in this community; regional violence can also cause losses, reduced by protection and coordination. Demand grows alongside labor. These rates are invented, not historical casualty or demographic estimates. Storage reduces spoilage and buffers shortages. High exclusion or a shortfall can undermine cooperation; shortfalls can also reduce later labor capacity, with recovery when the food target is met. Cutting institutions lowers future upkeep but abandons some stored resources. Unequal access and centralization do not add automatic food bonuses.</p><p>The model omits household food distribution, land tenure, age structure, migration motives, coercion’s full effects, disease, and much regional variability. Discuss how these omissions affect interpretation. A community can meet its aggregate target while access remains unequal.</p></details></div><button style="margin-top:15px" onclick="guide=false;render()">Return to activity</button></aside></div>`}
else if(s.stage==='intro'){h=`<div class="grid"><section><span class="eyebrow">ANTH 151: Emerging Humanity · Week 9 · 40 minutes</span><h1>How do communities<br>become more complex?</h1><p style="font-size:22px">Explore population growth, specialized activities, and increasing (inter-)dependence.</p><p class="muted">Developed by Christian Peterson<br>Department of Anthropology, University of Hawaiʻi at Mānoa</p><p>Your community begins with about 100 people, produces food, stores some of it, and interacts with neighboring villages. As population grows and activities become more specialized, households and villages may depend increasingly on one another. How will you coordinate those relationships to foster increasingly complex ways of living together?</p><div class="notice">Choose the community you want to sustain. Learn from consequences and adapt. Greater hierarchy, larger monuments, and warfare are not automatic measures of success.</div><p>This is a fresh starting point following Seeds of Change; no previous result is needed. Other student groups provide comparisons. Their choices do not change your neighbors’ scripted behavior.</p><label for="group">Group name (optional; avoid personal names)</label><input id="group" value="${esc(s.group)}" oninput="s.group=this.value;save()"><label for="scenario">Scenario assigned by your TA</label><select id="scenario" onchange="s.scenario=this.value;save()"><option ${s.scenario==='A'?'selected':''}>A</option><option ${s.scenario==='B'?'selected':''}>B</option></select><div class="actions"><button class="primary" onclick="s.stage='priorities';render()">Set your priorities →</button></div></section><aside><div class="card" style="margin-bottom:18px;background:#e5eeeb"><svg viewBox="0 0 500 280" role="img" aria-label="A small stylized village in the shadow of one large and one smaller pyramid"><rect width="500" height="280" rx="12" fill="#dce8df"/><circle cx="425" cy="42" r="22" fill="#e9c67b"/><path d="M0 188Q260 155 500 180V280H0" fill="#c9cfab"/><path d="M85 174L228 18 355 174Z" fill="#c3a16e"/><path d="M228 18L355 174 260 174Z" fill="#92734f"/><path d="M319 172L386 89 455 172Z" fill="#ccb184"/><path d="M386 89L455 172 402 172Z" fill="#9d8059"/><path d="M227 173L402 275H258L118 192Z" fill="#9fa68c" opacity=".48"/><path d="M386 172L497 235H438L340 185Z" fill="#9fa68c" opacity=".35"/><g stroke="#9c7b52" stroke-width="2"><path d="M107 150H336M128 128H318M149 105H299M170 82H280M192 59H261"/><path d="M337 151H437M354 131H420M370 111H404"/></g><g fill="#efe1c2" stroke="#736d53" stroke-width="2"><path d="M32 230v-35l24-18 24 18v35zM103 210v-29l21-16 21 16v29zM166 241v-31l23-18 23 18v31zM245 220v-28l21-16 21 16v28zM319 253v-32l23-18 23 18v32zM392 232v-30l22-17 22 17v30z"/></g><g fill="#796950"><rect x="52" y="210" width="10" height="20"/><rect x="120" y="193" width="9" height="17"/><rect x="184" y="222" width="10" height="19"/><rect x="262" y="204" width="9" height="16"/><rect x="338" y="234" width="9" height="19"/><rect x="411" y="213" width="9" height="19"/></g><g fill="#306c75"><circle cx="94" cy="242" r="4"/><circle cx="228" cy="238" r="4"/><circle cx="287" cy="248" r="4"/></g></svg></div><div class="card"><h2>Your discussion plan</h2><p><b>6 min</b> · Choose priorities<br><b>24 min</b> · Make eight decisions<br><b>4 min</b> · Prepare a recommendation<br><b>6 min</b> · Compare and debrief</p><h3>Different questions</h3><p><b>Specialization:</b> who does particular work?<br><b>Stratification:</b> how is unequal access reproduced?<br><b>Governance:</b> how are decisions made and enforced?<br><b>Integration:</b> how are households and communities connected?</p><small>Progress saves in this browser. The activity collects no accounts, personal names, or submissions. Numbers are teaching units.</small></div></aside></div>`}
else if(s.stage==='priorities'){h=`<span class="eyebrow">Preparation · Choose, explain, adapt</span><h1>What matters to your plan?</h1><div class="grid"><div class="card"><p>Choose <b>three priorities</b> for your proposed strategy. There is no ranking of priorities. Specialization includes crafts, administration, and other activities; (inter-)dependence concerns the development of closer and sometimes unequal relationships among households and neighboring villages.</p>${categories.map(([k,label])=>`<div class="rank" style="grid-template-columns:1fr"><label><input type="checkbox" ${s.priorities.includes(k)?'checked':''} ${!s.priorities.includes(k)&&s.priorities.length===3?'disabled':''} onchange="toggle('${k}')">${label}</label></div>`).join('')}<p><b>${s.priorities.length}/3 priorities selected.</b> Focusing reduces project coordination costs for related choices; it does not lock you into a strategy.</p></div><aside class="card">${note('goal','What kind of community do you want to sustain? Define success in your own terms.')}${note('priorities','Why these three? Name the people, resources, and technologies your plan needs.')}<p class="muted">Your choices reduce the coordination costs of related projects. You can still choose other projects as conditions change.</p><button class="primary" ${s.priorities.length!==3?'disabled':''} onclick="s.stage='decision';render()">Begin decisions →</button></aside></div>`}
else if(s.stage==='decision'){const r=rounds[s.round];h=`<span class="eyebrow">Decision ${s.round+1} of 8 · Scenario ${s.scenario}</span><div class="bar"><span style="width:${s.round/8*100}%"></span></div><h1 style="font-size:46px">${r.title}</h1>${stats()}<p>${r.intro}</p><div class="notice">Available labor: <b>${Math.round(s.population)-s.strain}</b>. Institutional upkeep and projects leave fewer people working directly on food. Your priorities: ${s.priorities.map(k=>names[k]).join('; ')}.</div><div class="choices" style="margin-top:20px">${r.options.map((o,i)=>{let p=plan(s,i);return `<button class="choice ${s.choice===i?'selected':''}" aria-pressed="${s.choice===i}" onclick="s.choice=${i};render(true)"><b>${o.title}</b>${o.body}<p class="muted">${o.detail}</p><small>Labor: upkeep ${p.maintenance}; project ${p.project}; food ${p.foodWork}.${p.focused?' Your priority lowers this project’s cost.':''}</small></button>`}).join('')}</div>${note('reason'+s.round,'Why this choice? Who benefits, who bears the cost, and what could go wrong?')}<div class="actions"><button class="primary" ${s.choice===null?'disabled':''} onclick="resolve(s,s.choice);render()">Commit & reveal conditions →</button></div>${portrait()}`}
else if(s.stage==='result'){let r=s.history.at(-1);h=`<span class="eyebrow">Outcome ${s.round} of 8 · Interpret before adapting</span><h1 style="font-size:46px">${r.event}</h1><p>Your decision: <b>${r.choice}</b></p>${stats()}<div class="grid"><div class="card"><h2>${r.food>=r.target?'Aggregate food target met':'A food shortfall remains'}</h2><p>${r.food>=r.target?'Food availability is only one outcome. Check access, cooperation, autonomy, and institutional costs.':'Continue the activity. Shortfalls can weaken cooperation and next episode’s labor capacity; meeting the target supports recovery.'}</p><table><tr><th>Food flow</th><th>Units</th></tr><tr><td>Local food production</td><td>${r.local}</td></tr><tr><td>Food obtained through exchange</td><td>${r.exchange}</td></tr><tr><td>Resources seized through aggression</td><td>${r.raidGain}</td></tr><tr><td>Retaliation losses</td><td>−${r.retaliation}</td></tr><tr><td>Food transferred under unequal obligations</td><td>−${r.obligations}</td></tr><tr><td>Conflict and escalation losses</td><td>−${r.conflictLoss}</td></tr><tr><td>Reserves abandoned when scaling back</td><td>${r.abandoned}</td></tr><tr><td>Storage losses</td><td>${r.loss}</td></tr><tr><td>Stored food used</td><td>${r.used}</td></tr></table><p><b>Labor:</b> ${r.budget} available; ${r.upkeep} upkeep, ${r.project} projects, ${r.foodWork} direct food work.</p><p><b>Population:</b> ${r.previousPopulation} at the start; +${r.populationIncrease} through growth/arrival; −${r.foodRelatedLoss} through food-related losses/departures; −${r.attackDeaths} killed during your attack; −${r.conflictDeaths} lost to regional violence. Next episode: <b>${r.population} people</b>.</p><small>Food above the current requirement is surplus. Aggregate availability does not show which households actually eat.</small></div><aside>${portrait()}<details><summary>Institutions you are maintaining</summary><p>${Object.entries(s.systems).filter(([k,v])=>v>0&&k!=='tools').map(([k,v])=>(names[k]||k)+': '+v.toFixed(1)).join('<br>')||'No durable institutions yet.'}</p><small>Investment levels measure modeled capacity, not cultural sophistication.</small></details>${note('reflection'+s.round,'Record one consequence and one possible adjustment.')}</aside></div><div class="actions"><button class="primary" onclick="s.stage=s.round===8?'debrief':'decision';render()">${s.round===8?'Review your strategy':'Next decision'} →</button></div>`}
else{h=`<span class="eyebrow">Group ${esc(s.group||'discussion')} · Scenario ${s.scenario}</span><h1>Which priorities would you uphold?<br>Which would you change?</h1><div class="notice"><b>Across eight episodes:</b> population 100 → ${s.population}; ${s.history.reduce((n,r)=>n+r.attackDeaths+r.conflictDeaths,0)} violent deaths; ${s.history.filter(r=>r.food<r.target).length} episodes with a food shortfall. Compare these outcomes alongside obligations, cooperation, and autonomy.</div>${stats()}${portrait()}<h2>Your decision record</h2><div class="card scroll"><table><tr><th>Round</th><th>Choice</th><th>Conditions</th><th>Food / requirement</th><th>Reserve</th><th>Cooperation</th><th>Population</th><th>Violent losses</th><th>(Inter-)dependence</th><th>Unequal dependencies</th><th>Political integration</th><th>Autonomy</th><th>Unequal access</th></tr>${s.history.map(r=>`<tr><td>${r.round}</td><td>${r.choice}</td><td>${r.event}</td><td>${r.food} / ${r.target}</td><td>${r.reserve}</td><td>${r.trust}</td><td>${r.population}</td><td>${r.attackDeaths+r.conflictDeaths}</td><td>${Math.round(r.interdependence)}</td><td>${r.dependencyAsymmetry}</td><td>${r.regionalIntegration}</td><td>${r.autonomy}</td><td>${r.inequality}</td></tr>`).join('')}</table></div><div class="grid" style="margin-top:22px"><div class="card"><h2>A 60–90 second recommendation</h2>${note('pitch','Recommend an organization. Cite two outcomes and acknowledge one cost.')}${note('steps','What actions and resources would sustain it? Which obstacle would you address first?')}${note('revise','Would you change your three priorities? Explain.')}</div><aside class="card"><h2>Think like an archaeologist</h2>${note('evidence','What traces might remain in houses, burials, stores, workshops, or public structures?')}${note('alternative','Give another possible explanation for one of those traces.')}${note('compare','How might a different environment or neighboring community change your recommendation?')}<p class="notice">There is no single complexity score. Compare forms of organization and their consequences.</p></aside></div><details><summary>Initial priorities and reasoning</summary><p>Priorities: ${s.priorities.map(k=>names[k]).join('; ')}</p><p>Goal: ${esc(s.notes.goal||'')}</p><p>Initial reasoning: ${esc(s.notes.priorities||'')}</p>${s.history.map(r=>`<p><b>Round ${r.round}:</b> ${esc(r.reason)}<br>${esc(s.notes['reflection'+r.round]||'')}</p>`).join('')}</details><div class="actions no-print"><button class="primary" onclick="window.print()">Print / save discussion record</button><button onclick="download()">Download notes (.txt)</button><button onclick="guide=true;render()">TA debrief guide</button></div>`}document.getElementById('app').innerHTML=h+'<footer>Pathways of Complexification · ANTH 151: Emerging Humanity · Developed by Christian Peterson</footer>';window.scrollTo(0,keepScroll?scrollY:0)}
function download(){const content=['Pathways of Complexification — ANTH 151: Emerging Humanity','Group: '+s.group+' | Scenario '+s.scenario,'Priorities: '+s.priorities.map(k=>names[k]).join('; '),...s.history.map(r=>`Round ${r.round}: ${r.choice}; ${r.event}; food ${r.food}/${r.target}; population ${r.population} (start ${r.previousPopulation}, increase ${r.populationIncrease}, food-related losses ${r.foodRelatedLoss}, attack deaths ${r.attackDeaths}, regional-violence losses ${r.conflictDeaths}); (inter-)dependence ${Math.round(r.interdependence)}; unequal dependencies ${r.dependencyAsymmetry}; political integration ${r.regionalIntegration}; reserve ${r.reserve}; cooperation ${r.trust}; autonomy ${r.autonomy}; unequal access ${r.inequality}; centralized authority ${r.centralization}; conflict escalation ${r.violence}; labor ${r.budget} (upkeep ${r.upkeep}, project ${r.project}, food ${r.foodWork})\nReason: ${r.reason}\nReflection: ${s.notes['reflection'+r.round]||''}`),...['goal','priorities','pitch','steps','revise','evidence','alternative','compare'].map(k=>k+': '+(s.notes[k]||''))].join('\n\n');const url=URL.createObjectURL(new Blob([content],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download='complexification-discussion.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script></html>
